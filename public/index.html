<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Snake Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      color: #f4f4f4;
      user-select: none;
      image-rendering: pixelated;
    }
    body {
      background: repeating-conic-gradient(#1a1c2c 0% 25%, #1f2340 0% 50%) 0 0 / 24px 24px;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.07) 0 1px, transparent 1px 3px);
      pointer-events: none;
      z-index: 300;
    }
    #app {
      position: fixed;
      top: 8px;
      bottom: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    #stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      padding: 3px 3px 0;
    }
    #stats > div {
      background: #333c57;
      box-shadow: inset -3px -3px 0 #1a1c2c, inset 3px 3px 0 #566c86, 0 0 0 3px #0b0b12;
      padding: 8px 3px 7px;
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
    }
    #stats .lbl {
      font-size: clamp(5px, 1.5vw, 9px);
      color: #94b0c2;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    #stats .lbl canvas {
      width: 10px;
      height: 10px;
      image-rendering: pixelated;
      vertical-align: middle;
      margin-right: 3px;
    }
    #stats > div > div:last-child {
      font-size: clamp(7px, 2.2vw, 14px);
    }
    #stats > div:nth-child(1) > div:last-child { color: #ffcd75; }
    #stats > div:nth-child(2) > div:last-child { color: #73eff7; }
    #stats > div:nth-child(3) > div:last-child { color: #a7f070; }
    #stats > div:nth-child(4) > div:last-child { color: #ef7d57; }
    #stats > div:nth-child(5) > div:last-child { color: #c0cbdc; }
    #bar {
      height: 14px;
      margin: 12px 3px 0;
      padding: 3px;
      background: #1a1c2c;
      box-shadow: 0 0 0 3px #0b0b12, inset 0 0 0 2px #566c86;
    }
    #barFill {
      height: 100%;
      width: 0;
      background: repeating-linear-gradient(90deg, #a7f070 0 6px, #38b764 6px 8px);
      transition: width 0.25s steps(8);
    }
    #wrap {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      margin: 14px 0 3px;
      overflow: hidden;
      border: 4px solid #94b0c2;
      box-shadow: 0 0 0 4px #0b0b12;
      background: #0b0b12;
    }
    #wrap canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      image-rendering: pixelated;
    }
    #toasts {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }
    .t {
      padding: 6px 8px;
      font-size: clamp(6px, 1.8vw, 11px);
      line-height: 1.4;
      background: #1a1c2c;
      border: 3px solid;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.55);
      animation: popIn 0.25s steps(4);
      pointer-events: none;
      transition: opacity 0.2s steps(3);
    }
    .t.apel { border-color: #a7f070; color: #a7f070; }
    .t.bom { border-color: #ef7d57; color: #ef7d57; }
    .t.menang { border-color: #ffcd75; color: #ffcd75; }
    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    #gifts {
      display: none;
    }
    #banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(18px, 6vw, 48px);
      line-height: 1.5;
      text-align: center;
      color: #ffcd75;
      opacity: 0;
      transition: opacity 0.2s steps(3);
      pointer-events: none;
      text-shadow: 4px 4px 0 #b13e53, 8px 8px 0 #0b0b12;
      z-index: 150;
    }
    #banner.show {
      opacity: 1;
    }
    #tamat {
      position: fixed;
      inset: 0;
      background: rgba(11, 11, 18, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s steps(6);
      z-index: 100;
    }
    #tamat.on {
      opacity: 1;
    }
    #tamat .txt {
      font-size: clamp(28px, 9vw, 96px);
      color: #ef7d57;
      text-shadow: 6px 6px 0 #b13e53, 12px 12px 0 #0b0b12;
    }
    #tamat .sub {
      font-size: clamp(9px, 2.4vw, 24px);
      color: #f4f4f4;
      margin-top: 28px;
    }
    #test {
      position: fixed;
      bottom: 16px;
      left: 8px;
      right: 8px;
      display: none;
      background: #1a1c2c;
      border: 3px solid #94b0c2;
      padding: 8px;
      z-index: 50;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.6);
    }
    #testRow {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    #testRow button {
      font-family: inherit;
      font-size: 8px;
      padding: 6px 8px;
      color: #f4f4f4;
      background: #333c57;
      border: 2px solid #0b0b12;
      box-shadow: inset -2px -2px 0 #1a1c2c, inset 2px 2px 0 #566c86;
      cursor: pointer;
    }
    #start {
      position: fixed;
      inset: 0;
      background: repeating-conic-gradient(#1a1c2c 0% 25%, #1f2340 0% 50%) 0 0 / 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      text-align: center;
      padding: 16px;
    }
    #start .title {
      font-size: clamp(20px, 6vw, 64px);
      color: #a7f070;
      text-shadow: 4px 4px 0 #257179, 8px 8px 0 #0b0b12;
      margin-bottom: 40px;
      line-height: 1.4;
    }
    #start .btn {
      font-family: inherit;
      padding: 18px 24px;
      font-size: clamp(9px, 2.4vw, 22px);
      color: #fff;
      background: #38b764;
      border: 4px solid #0b0b12;
      box-shadow: inset -4px -4px 0 #257179, inset 4px 4px 0 #a7f070, 6px 6px 0 #0b0b12;
      cursor: pointer;
    }
    #start .btn:active {
      transform: translate(4px, 4px);
      box-shadow: inset -4px -4px 0 #257179, inset 4px 4px 0 #a7f070, 2px 2px 0 #0b0b12;
    }
    #start .hint {
      margin-top: 36px;
      font-size: clamp(6px, 1.6vw, 12px);
      line-height: 1.8;
      color: #94b0c2;
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #566c86;
    }
  </style>
</head>
<body>
  <div id="start">
    <div class="title">SNAKE BOT</div>
    <button class="btn" id="startBtn">MULAI / LAYAR PENUH</button>
    <div class="hint">KIRIM HADIAH DI LIVE<br>BUAT MENGATUR GAME</div>
  </div>

  <div id="banner"></div>
  <div id="tamat">
    <div class="txt">TAMAT</div>
    <div class="sub">Permainan selesai</div>
  </div>

  <div id="test">
    <div id="testRow"></div>
  </div>

  <div id="app">
    <div id="stats">
      <div><div class="lbl">Level</div><div id="sLv">1</div></div>
      <div><div class="lbl">Menang</div><div id="sWin">0</div></div>
      <div><div class="lbl">Panjang</div><div id="sLen">3/15</div></div>
      <div><div class="lbl"><canvas id="iApel" width="8" height="8"></canvas>Apel</div><div id="sApel">0</div></div>
      <div><div class="lbl"><canvas id="iBom" width="8" height="8"></canvas>Bom</div><div id="sBom">0</div></div>
    </div>
    <div id="bar"><div id="barFill"></div></div>
    <div id="wrap">
      <canvas id="cv"></canvas>
      <div id="toasts"></div>
    </div>
    <div id="gifts"></div>
  </div>

  <script type="module">(() => { 'use strict';
    // ===== TAHAP 2B: LOGIKA GAME =====
    const $ = id => document.getElementById(id);
    const COLS = 40;
    const SWEEP_GAP = 2; // jarak antar baris sapuan (1 = menyapu setiap baris)
    const MAX_A = 60;
    const MAX_B = 90;
    const QMAX = 6000;
    const MAX_PART = 160;
    const DIRS = [
      { x: 1, y: 0 },
      { x: 0, y: -1 },
      { x: -1, y: 0 },
      { x: 0, y: 1 }
    ];
    const TEST = new URLSearchParams(window.location.search).get('tes') === '1';
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    let ROWS = 10;
    let bgCv = null;
    let cell = 20;
    const GIFTS = {};
    const P = [];
    let started = false;
    let T = 0;
    const S = {
      level: 1,
      wins: 0,
      apples: 0,
      bombs: 0,
      paused: false,
      shake: 0,
      lastGift: 0,
      lastApple: 0,
      lastBomb: 0,
      lastStep: 0,
      snake: [],
      prev: [],
      dir: { x: 1, y: 0 },
      items: new Map(),
      cA: 0,
      cB: 0,
      qA: [],
      qB: [],
      appleTimer: 0,
      bombTimer: 0,
      bombInterval: 0,
      sweepDir: 1,
      turn: 0
    };

    const rnd = () => Math.random();
    const key = (x, y) => y * COLS + x;
    const wx = (x) => ((x % COLS) + COLS) % COLS;
    const wy = (y) => ((y % ROWS) + ROWS) % ROWS;
    const target = () => 15 + (S.level - 1) * 2;
    const stepMs = () => Math.max(60, 170 - S.level * 2.2);

    function layout() {
      const wrap = document.getElementById('wrap');
      // ukur ruang yang tersedia, lalu pas-kan arena ke kelipatan sel
      wrap.style.flex = '1 1 0';
      wrap.style.alignSelf = 'stretch';
      wrap.style.width = '';
      wrap.style.height = '';
      cell = Math.max(4, Math.floor(wrap.clientWidth / COLS));
      ROWS = Math.max(10, Math.floor(wrap.clientHeight / cell));
      wrap.style.flex = '0 0 auto';
      wrap.style.alignSelf = 'center';
      wrap.style.width = (cell * COLS + 8) + 'px';
      wrap.style.height = (ROWS * cell + 8) + 'px';
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = cell * COLS * dpr;
      cv.height = cell * ROWS * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      cv.style.width = cell * COLS + 'px';
      cv.style.height = cell * ROWS + 'px';
      cv.style.left = '0px';
      cv.style.top = '0px';
      // latar kotak-kotak: 1 piksel per sel, diperbesar tanpa blur
      bgCv = document.createElement('canvas');
      bgCv.width = COLS;
      bgCv.height = ROWS;
      const bg = bgCv.getContext('2d');
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          bg.fillStyle = (x + y) % 2 ? '#1b1f36' : '#20253f';
          bg.fillRect(x, y, 1, 1);
        }
      }
    }

    function newGame() {
      S.snake = [
        { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) },
        { x: Math.floor(COLS / 2) - 1, y: Math.floor(ROWS / 2) },
        { x: Math.floor(COLS / 2) - 2, y: Math.floor(ROWS / 2) }
      ];
      S.prev = S.snake.map(p => ({ ...p }));
      S.dir = { x: 1, y: 0 };
      S.items.clear();
      S.cA = 0;
      S.cB = 0;
      S.qA = [];
      S.qB = [];
      S.appleTimer = 0;
      S.bombTimer = 0;
      S.sweepDir = 1;
      S.turn = 0;
      hud();
      T = performance.now();
    }

    function resetRound() {
      S.snake = [
        { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) },
        { x: Math.floor(COLS / 2) - 1, y: Math.floor(ROWS / 2) },
        { x: Math.floor(COLS / 2) - 2, y: Math.floor(ROWS / 2) }
      ];
      S.prev = S.snake.map(p => ({ ...p }));
      S.dir = { x: 1, y: 0 };
      S.items.clear();
      S.cA = 0;
      S.cB = 0;
      S.qA = [];
      S.qB = [];
      S.appleTimer = 0;
      S.bombTimer = 0;
      S.sweepDir = 1;
      S.turn = 0;
      hud();
    }

    function hud() {
      $('sLv').textContent = S.level;
      $('sWin').textContent = S.wins;
      $('sLen').textContent = S.snake.length + '/' + target();
      $('sApel').textContent = S.apples;
      $('sBom').textContent = S.bombs;
      $('barFill').style.width = Math.min(100, S.snake.length / target() * 100) + '%';
    }

    function put(k, t) {
      S.items.set(k, { t: t, k: k, born: T });
      if (t === 'a') S.cA++;
      else S.cB++;
    }

    function take(k) {
      return S.items.get(k);
    }

    function freeCell() {
      const occ = new Set();
      for (const seg of S.snake) occ.add(key(seg.x, seg.y));
      for (const k of S.items.keys()) occ.add(k);
      const total = COLS * ROWS;
      if (occ.size >= total) return -1;
      for (let tries = 0; tries < 40; tries++) {
        const k = Math.floor(rnd() * total);
        if (!occ.has(k)) return k;
      }
      for (let k = 0; k < total; k++) if (!occ.has(k)) return k;
      return -1;
    }

    function addItems(t, n) {
      n = Math.max(0, n);
      const q = t === 'a' ? S.qA : S.qB;
      for (let i = 0; i < n; i++) {
        const count = t === 'a' ? S.cA : S.cB;
        const limit = t === 'a' ? MAX_A : MAX_B;
        if (count < limit) {
          const k = freeCell();
          if (k === -1) break;
          put(k, t);
        } else if (q.length < QMAX) {
          q.push(1);
        } else {
          break;
        }
      }
    }

    function drain() {
      for (let n = 0; n < 20; n++) {
        if (S.qA.length > 0 && S.cA < MAX_A) {
          const k = freeCell();
          if (k === -1) break;
          S.qA.pop();
          put(k, 'a');
        } else if (S.qB.length > 0 && S.cB < MAX_B) {
          const k = freeCell();
          if (k === -1) break;
          S.qB.pop();
          put(k, 'b');
        } else {
          break;
        }
      }
    }

    // Gerak berpola: menyapu satu baris sampai ujung, turun, lalu kembali ke arah sebaliknya
    function botDir() {
      if (S.turn > 0) {
        S.turn--;
        return 3; // turun
      }
      const hx = S.snake[0].x;
      const atEdge = (S.sweepDir === 1 && hx >= COLS - 1) || (S.sweepDir === -1 && hx <= 0);
      if (atEdge) {
        S.sweepDir = -S.sweepDir;
        S.turn = SWEEP_GAP - 1;
        return 3; // turun
      }
      return S.sweepDir === 1 ? 0 : 2;
    }

    function step() {
      S.prev = S.snake.map(p => ({ ...p }));
      const d = botDir();
      const head = S.snake[0];
      const nk = { x: wx(head.x + DIRS[d].x), y: wy(head.y + DIRS[d].y) };
      S.snake.unshift(nk);
      S.dir = DIRS[d];
      const k = key(nk.x, nk.y);
      const item = S.items.get(k);
      let grow = false;
      if (item) {
        S.items.delete(k);
        if (item.t === 'a') {
          S.cA = Math.max(0, S.cA - 1);
          S.apples++;
          grow = true;
          fx(k, '#4ade80', 8, 90);
        } else {
          S.cB = Math.max(0, S.cB - 1);
          S.bombs++;
          S.shake = 260;
          fx(k, '#ff6600', 12, 120);
        }
      }
      if (!grow) S.snake.pop();
      if (item && item.t === 'b') {
        const cut = Math.max(3, 2 + Math.min(6, Math.floor(S.level / 6)));
        if (S.snake.length > cut) {
          S.snake = S.snake.slice(0, cut);
          S.prev = S.snake.map(p => ({ ...p }));
        }
      }
      drain();
      hud();
      if (S.snake.length >= target()) levelUp();
    }

    function levelUp() {
      S.wins++;
      if (S.level >= 50) {
        tamat();
        return;
      }
      S.level++;
      resetRound();
      banner('LEVEL UP', 'Level ' + S.level);
      confetti();
    }

    function tamat() {
      S.paused = true;
      $('tamat').classList.add('on');
      setTimeout(() => {
        S.level = 1;
        S.wins = 0;
        S.apples = 0;
        S.bombs = 0;
        resetRound();
        S.paused = false;
        $('tamat').classList.remove('on');
      }, 6000);
    }

    function onGift(m) {
      const g = GIFTS[m.gift];
      if (!g) return;
      if (!started || S.paused) return;
      const count = Math.min(500, Math.max(1, m.count || 1));
      S.lastGift = T;
      toast('@' + (m.user || 'anon') + ' kirim ' + g.nama + ' x' + count, g.aksi);
      if (g.aksi === 'menang') {
        const n = Math.min(count, 5);
        for (let i = 0; i < n; i++) levelUp();
      } else {
        const aksi = g.aksi === 'apel' ? 'a' : 'b';
        const qty = Math.min(3000, g.jumlah * count);
        addItems(aksi, qty);
      }
    }

    function toast(text, cls) {
      const max = 4;
      const toasts = $('toasts');
      const t = document.createElement('div');
      t.className = 't ' + cls;
      t.textContent = text;
      toasts.appendChild(t);
      while (toasts.children.length > max) toasts.removeChild(toasts.firstChild);
      setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'scale(0.9)';
      }, 3200);
    }

    function banner(t, sub) {
      const el = $('banner');
      el.textContent = t;
      el.classList.add('show');
      if (sub) {
        el.innerHTML = `<div>${t}</div><div style="font-size:clamp(14px,3vw,28px);font-weight:600;color:#fff;">${sub}</div>`;
      }
      setTimeout(() => el.classList.remove('show'), 2200);
    }

    function update(dt) {
      if (S.paused) return;
      if (T - S.lastStep >= stepMs()) {
        step();
        S.lastStep = T;
      }
      if (S.appleTimer === 0) {
        S.appleTimer = 5000;
      }
      S.appleTimer -= dt;
      if (S.appleTimer <= 0) {
        S.appleTimer = 5000;
        const k = freeCell();
        if (k !== -1 && S.cA < MAX_A) {
          put(k, 'a');
          S.cA++;
          S.apples++;
          if (S.snake.length >= target()) levelUp();
        }
      }
      if (S.bombTimer === 0) {
        S.bombTimer = Math.max(4000, 14000 - S.level * 200);
      }
      S.bombTimer -= dt;
      if (S.bombTimer <= 0) {
        S.bombTimer = Math.max(4000, 14000 - S.level * 200);
        const n = 1 + Math.floor(S.level / 10);
        for (let i = 0; i < n; i++) {
          const k = freeCell();
          if (k !== -1 && S.cB < MAX_B) {
            put(k, 'b');
            S.cB++;
            S.bombs++;
            fx(k, '#ff6600', 12, 80);
          }
        }
      }
      if (S.shake > 0) S.shake -= dt;
      updateParts(dt);
    }

    function part(x, y, vx, vy, life, color, size, grav) {
      if (P.length >= MAX_PART) return;
      P.push({ x, y, vx, vy, life, color, size, grav: grav || 0.05 });
    }

    function fx(k, color, n, speed) {
      const sc = Math.max(0.5, cell / 20);
      const cx = (k % COLS + 0.5) * cell;
      const cy = (Math.floor(k / COLS) + 0.5) * cell;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = speed * sc * (0.5 + Math.random() * 0.5);
        part(cx, cy, Math.cos(a) * v, Math.sin(a) * v, 0.4 + Math.random() * 0.6, color, (3 + Math.random() * 4) * sc, 0.15);
      }
    }

    function confetti() {
      for (let i = 0; i < 80; i++) {
        const x = (rnd() * COLS + 0.5) * cell;
        const y = (rnd() * ROWS + 0.5) * cell;
        part(x, y, (rnd() - 0.5) * 120, -rnd() * 60 - 20, 1.0 + Math.random() * 0.5, '#ffd700', 4, 0.08);
      }
    }

    function updateParts(dt) {
      const s = dt / 1000;
      for (let i = P.length - 1; i >= 0; i--) {
        const p = P[i];
        p.x += p.vx * s;
        p.y += p.vy * s;
        p.vy += p.grav * 400 * s;
        p.life -= s;
        if (p.life <= 0) P.splice(i, 1);
      }
    }

    // ===== TAHAP 2C: GRAFIK, SOCKET, LOOP =====
    function arc(x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function pop(p) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
    }

    const PI2 = Math.PI * 2;

    function makeSprite(rows, pal) {
      const c = document.createElement('canvas');
      c.width = 8;
      c.height = 8;
      const g = c.getContext('2d');
      for (let y = 0; y < rows.length; y++) {
        for (let x = 0; x < rows[y].length; x++) {
          const col = pal[rows[y][x]];
          if (col) {
            g.fillStyle = col;
            g.fillRect(x, y, 1, 1);
          }
        }
      }
      return c;
    }

    const SPR_A = makeSprite([
      '....bg..',
      '...bggg.',
      '.dddbdd.',
      'drrrrrrd',
      'drhrrrrd',
      'drhrrrrd',
      '.drrrrd.',
      '..dddd..'
    ], { b: '#733e39', g: '#63c74d', d: '#a22633', r: '#e43b44', h: '#ff9a9a' });

    const SPR_B = makeSprite([
      '.....yo.',
      '....f...',
      '..xxxx..',
      '.xkkkkx.',
      'xkwkkkkx',
      'xkkkkkkx',
      '.xkkkkx.',
      '..xxxx..'
    ], { y: '#ffcd75', o: '#ef7d57', f: '#c28d4b', x: '#0b0b12', k: '#566c86', w: '#c0cbdc' });

    for (const pair of [['iApel', SPR_A], ['iBom', SPR_B]]) {
      const c = document.getElementById(pair[0]);
      if (c) c.getContext('2d').drawImage(pair[1], 0, 0);
    }

    function drawItems() {
      if (!S.items || S.items.size === 0) return;
      ctx.imageSmoothingEnabled = false;
      for (const it of S.items.values()) {
        const t = (T - it.born) / 300;
        if (t < 0) continue;
        const sc = Math.min(1, pop(t));
        const size = Math.max(2, Math.round(cell * 0.96 * sc));
        const gx = (it.k % COLS) * cell;
        const gy = Math.floor(it.k / COLS) * cell;
        const x = Math.round(gx + (cell - size) / 2);
        let y = gy + (cell - size) / 2;
        if (it.t === 'a') {
          y += Math.sin(T / 260 + it.k) * cell * 0.05;
          ctx.drawImage(SPR_A, x, Math.round(y), size, size);
        } else {
          const pulse = Math.sin(T / 200 + it.k * 0.37) * 0.5 + 0.5;
          ctx.fillStyle = 'rgba(255,60,60,' + (0.08 + pulse * 0.2).toFixed(2) + ')';
          ctx.fillRect(gx, gy, cell, cell);
          ctx.drawImage(SPR_B, x, Math.round(y), size, size);
        }
      }
    }

    function segPos(i, p) {
      const a = S.prev[i];
      const b = S.snake[i];
      if (!a) return { x: (b ? b.x + 0.5 : 0) * cell, y: (b ? b.y + 0.5 : 0) * cell };
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
        return { x: (b.x + 0.5) * cell, y: (b.y + 0.5) * cell };
      }
      const px = a.x + (b.x - a.x) * p;
      const py = a.y + (b.y - a.y) * p;
      return { x: (px + 0.5) * cell, y: (py + 0.5) * cell };
    }

    const SNAKE_PAL = [
      ['#1a3c2b', '#38b764', '#a7f070'],
      ['#1d2b53', '#3b5dc9', '#73eff7'],
      ['#5d275d', '#b13e53', '#ef7d57'],
      ['#3a2a1a', '#ef7d57', '#ffcd75'],
      ['#2a1a4a', '#7a4fd6', '#d7a5ff'],
      ['#0f3b3f', '#257179', '#73eff7']
    ];

    function drawSnake() {
      if (!S.snake || S.snake.length === 0) return;
      const pRaw = (T - S.lastStep) / stepMs();
      const p = S.paused ? 1 : Math.max(0, Math.min(1, pRaw));
      const len = S.snake.length;
      const pal = SNAKE_PAL[(S.level - 1) % SNAKE_PAL.length];
      const sz = Math.max(3, Math.round(cell * 0.92));
      const o = Math.max(1, Math.round(cell * 0.12));

      for (let i = len - 1; i >= 0; i--) {
        const a = segPos(i, p);
        const s = (i === len - 1 && len > 2) ? Math.max(3, Math.round(sz * 0.72)) : sz;
        const x = Math.round(a.x - s / 2);
        const y = Math.round(a.y - s / 2);
        ctx.fillStyle = pal[0];
        ctx.fillRect(x, y, s, s);
        ctx.fillStyle = i === 0 ? pal[2] : pal[1];
        ctx.fillRect(x + o, y + o, s - o * 2, s - o * 2);
        if (i > 0 && i % 2 === 0) {
          const h = Math.max(1, Math.round(s * 0.28));
          ctx.fillStyle = pal[2];
          ctx.fillRect(x + o, y + o, h, h);
        }
      }

      // kepala: mata dan lidah
      const head = segPos(0, p);
      const d = S.dir;
      const px = -d.y, py = d.x;
      const e = Math.max(2, Math.round(cell * 0.28));
      const pu = Math.max(1, Math.round(e * 0.5));
      for (const sd of [-1, 1]) {
        const ex = head.x + d.x * cell * 0.1 + px * cell * 0.22 * sd;
        const ey = head.y + d.y * cell * 0.1 + py * cell * 0.22 * sd;
        ctx.fillStyle = '#f4f4f4';
        ctx.fillRect(Math.round(ex - e / 2), Math.round(ey - e / 2), e, e);
        ctx.fillStyle = '#0b0b12';
        ctx.fillRect(Math.round(ex - pu / 2 + d.x * pu * 0.5), Math.round(ey - pu / 2 + d.y * pu * 0.5), pu, pu);
      }
      if ((T % 1400) / 1400 < 0.3) {
        const tl = Math.max(2, Math.round(cell * 0.4));
        const tw = Math.max(1, Math.round(cell * 0.14));
        const cx = head.x + d.x * (sz / 2 + tl / 2);
        const cy = head.y + d.y * (sz / 2 + tl / 2);
        const w = d.x !== 0 ? tl : tw;
        const h = d.x !== 0 ? tw : tl;
        ctx.fillStyle = '#ef233c';
        ctx.fillRect(Math.round(cx - w / 2), Math.round(cy - h / 2), w, h);
      }
    }

    function draw() {
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, cv.width, cv.height);
      if (S.shake > 0) {
        const a = Math.min(cell * 0.5, S.shake / 30);
        ctx.translate(Math.round((Math.random() - 0.5) * 2 * a), Math.round((Math.random() - 0.5) * 2 * a));
      }
      if (bgCv) ctx.drawImage(bgCv, 0, 0, COLS * cell, ROWS * cell);
      drawItems();
      drawSnake();
      for (let i = 0; i < P.length; i++) {
        const q = P[i];
        const ps = Math.max(1, Math.round(q.size * Math.max(0, q.life)));
        ctx.globalAlpha = Math.max(0, Math.min(1, q.life / 0.6));
        ctx.fillStyle = q.color;
        ctx.fillRect(Math.round(q.x - ps / 2), Math.round(q.y - ps / 2), ps, ps);
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    const ICONS = {
      mawar: function (g) {
        g.fillStyle = '#e11d48';
        g.beginPath();
        g.arc(20, 20, 16, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#f472b6';
        g.beginPath();
        g.moveTo(8, 20);
        g.bezierCurveTo(8, 10, 20, 6, 20, 20);
        g.bezierCurveTo(20, 34, 8, 30, 8, 20);
        g.fill();
      },
      rosa: function (g) {
        g.fillStyle = '#e11d48';
        g.beginPath();
        g.arc(20, 20, 16, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#f472b6';
        g.beginPath();
        g.moveTo(8, 20);
        g.bezierCurveTo(8, 10, 20, 6, 20, 20);
        g.bezierCurveTo(20, 34, 8, 30, 8, 20);
        g.fill();
      },
      gg: function (g) {
        g.fillStyle = '#fff';
        g.beginPath();
        g.arc(16, 20, 12, 0, Math.PI * 2);
        g.fill();
        g.beginPath();
        g.arc(24, 20, 12, 0, Math.PI * 2);
        g.fill();
      },
      jarihati: function (g) {
        g.fillStyle = '#a78bfa';
        g.beginPath();
        g.moveTo(8, 20);
        g.bezierCurveTo(8, 10, 20, 6, 20, 20);
        g.bezierCurveTo(20, 34, 8, 30, 8, 20);
        g.fill();
      },
      donat: function (g) {
        g.fillStyle = '#f59e0b';
        g.beginPath();
        g.arc(20, 20, 16, 0, Math.PI * 2);
        g.fill();
        g.strokeStyle = '#fff';
        g.lineWidth = 4;
        g.beginPath();
        g.arc(20, 20, 11, 0, Math.PI * 2);
        g.stroke();
        g.fillStyle = '#eab308';
        g.beginPath();
        g.arc(17, 17, 7, 0, Math.PI * 2);
        g.fill();
        g.beginPath();
        g.arc(26, 16, 7, 0, Math.PI * 2);
        g.fill();
        g.beginPath();
        g.arc(26, 20, 7, 0, Math.PI * 2);
        g.fill();
      },
      buket: function (g) {
        g.fillStyle = '#e11d48';
        g.beginPath();
        g.arc(20, 20, 16, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#f472b6';
        g.beginPath();
        g.arc(14, 16, 6, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#f59e0b';
        g.beginPath();
        g.arc(20, 14, 6, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#10b981';
        g.beginPath();
        g.arc(26, 16, 6, 0, Math.PI * 2);
        g.fill();
      },
      tanganhati: function (g) {
        g.fillStyle = '#a78bfa';
        g.beginPath();
        g.moveTo(8, 20);
        g.bezierCurveTo(8, 10, 20, 6, 20, 20);
        g.bezierCurveTo(20, 34, 8, 30, 8, 20);
        g.fill();
        g.strokeStyle = '#a78bfa';
        g.lineWidth = 4;
        g.beginPath();
        g.moveTo(20, 14);
        g.lineTo(20, 26);
        g.stroke();
        g.beginPath();
        g.moveTo(16, 20);
        g.lineTo(24, 20);
        g.stroke();
      },
      galaksi: function (g) {
        g.fillStyle = '#6366f1';
        g.beginPath();
        g.arc(20, 20, 14, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#818cf8';
        g.beginPath();
        g.arc(16, 16, 6, 0, Math.PI * 2);
        g.fill();
        g.beginPath();
        g.arc(24, 16, 6, 0, Math.PI * 2);
        g.fill();
        g.beginPath();
        g.arc(20, 24, 6, 0, Math.PI * 2);
        g.fill();
      }
    };

    function buildPanels() {
      const gifts = document.getElementById('gifts');
      gifts.innerHTML = '';
      const ids = Object.keys(GIFTS);
      for (const id of ids) {
        const g = GIFTS[id];
        const card = document.createElement('div');
        card.className = 'g';
        const canvas = document.createElement('canvas');
        canvas.width = 40;
        canvas.height = 40;
        const ctxD = canvas.getContext('2d');
        const iconFn = ICONS[id];
        if (iconFn) {
          iconFn(ctxD);
        } else {
          ctxD.fillStyle = '#666';
          ctxD.beginPath();
          ctxD.arc(20, 20, 15, 0, Math.PI * 2);
          ctxD.fill();
        }
        const n = document.createElement('div');
        n.className = 'n';
        n.textContent = g.nama;
        const e = document.createElement('div');
        e.className = 'e';
        e.textContent = '+'+g.jumlah+' '+g.aksi;
        const c = document.createElement('div');
        c.className = 'c';
        const coin = document.createElement('div');
        coin.className = 'coin';
        coin.textContent = g.koin + ' koin';
        c.appendChild(coin);
        card.appendChild(canvas);
        card.appendChild(n);
        card.appendChild(e);
        card.appendChild(c);
        if (TEST) {
          card.addEventListener('click', () => {
            onGift({ gift: id, count: 1, user: 'tes' });
          });
        }
        gifts.appendChild(card);
      }
      const test = document.getElementById('test');
      if (TEST) {
        test.style.display = 'flex';
        const row = document.getElementById('testRow');
        row.innerHTML = '';
        const hideBtn = document.createElement('button');
        hideBtn.textContent = 'Sembunyikan';
        hideBtn.style.padding = '10px 14px';
        hideBtn.style.borderRadius = '10px';
        hideBtn.style.border = 'none';
        hideBtn.style.background = 'rgba(255,255,255,0.1)';
        hideBtn.style.color = '#fff';
        hideBtn.style.cursor = 'pointer';
        hideBtn.onclick = () => { test.style.display = 'none'; };
        row.appendChild(hideBtn);
        const ids = Object.keys(GIFTS);
        for (const id of ids) {
          const btn = document.createElement('button');
          btn.className = 'tb';
          btn.textContent = id;
          btn.onclick = () => { onGift({ gift: id, count: 1, user: 'tes' }); };
          row.appendChild(btn);
        }
      }
    }

    async function loadGifts() {
      try {
        const res = await fetch('/api/gifts');
        if (!res.ok) throw new Error('gagal');
        const data = await res.json();
        for (const id of Object.keys(data)) {
          if (!GIFTS[id]) GIFTS[id] = data[id];
        }
        buildPanels();
      } catch (e) {
        setTimeout(loadGifts, 3000);
      }
    }

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(proto + '//' + location.host);
      ws.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.type === 'gift') onGift(m);
        else if (m.type === 'status') {
          const conn = document.getElementById('conn');
          if (conn) conn.textContent = 'Koneksi: ' + m.tiktok;
        }
      };
      ws.onclose = () => {
        const delay = Math.min(1000 * Math.pow(1.7, connectWS.attempt || 0), 8000);
        connectWS.attempt = (connectWS.attempt || 0) + 1;
        setTimeout(connectWS, delay);
      };
      ws.onerror = () => {
        ws.close();
      };
    }

    let ws = null;

    function startWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host);
      ws.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.type === 'gift') onGift(m);
        else if (m.type === 'status') {
          const conn = document.getElementById('conn');
          if (conn) conn.textContent = 'Koneksi: ' + m.tiktok;
        }
      };
      ws.onclose = () => {
        const delay = Math.min(1000 * Math.pow(1.7, reconnectAttempt || 0), 8000);
        reconnectAttempt = (reconnectAttempt || 0) + 1;
        setTimeout(startWS, delay);
      };
      ws.onerror = () => {
        ws.close();
      };
    }

    async function lockScreen() {
      try {
        if (navigator.wakeLock) {
          const lock = await navigator.wakeLock.request('screen');
          document.addEventListener('visibilitychange', async () => {
            if (!document.hidden) {
              try { await navigator.wakeLock.request('screen'); } catch (e) {}
            }
          });
        }
      } catch (e) { /* ignore */ }
    }

    function loop(now) {
      requestAnimationFrame(loop);
      if (T > 0 && now - T < 24) return;
      T = now;
      if (started && !S.paused) {
        update(Math.min(T - (lastFrameTime || 0), 100));
        draw();
        lastFrameTime = T;
      }
    }

    let reconnectAttempt = 0;
    let lastFrameTime = 0;

    function setupEvents() {
      document.getElementById('startBtn').addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
          await lockScreen();
        } catch (e) {}
        document.getElementById('start').style.display = 'none';
        setTimeout(() => {
          layout();
          T = performance.now();
          newGame();
          started = true;
          lastFrameTime = T;
        }, 350);
        if (TEST) document.getElementById('test').style.display = 'flex';
      });
      document.getElementById('stats').addEventListener('click', () => {
        if (TEST) {
          const testEl = document.getElementById('test');
          testEl.style.display = testEl.style.display === 'flex' ? 'none' : 'flex';
        }
      });
      window.addEventListener('resize', () => {
        if (!started) return;
        layout();
        resetRound();
      });
      window.addEventListener('visibilitychange', async () => {
        if (!document.hidden) await lockScreen();
      });
    }

    layout();
    loadGifts();
    startWS();
    requestAnimationFrame(loop);
    setupEvents();
  })();</script>
